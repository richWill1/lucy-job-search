name: Daily vacancy refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape_jobs.py
      - name: Commit refreshed vacancy data
        run: |
          git config user.name "Lucy Job Search Bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Daily vacancy refresh"
          git push
